# ============================================================================
# WORKFLOW: build  (CI — Integración Continua)
# ============================================================================
# ¿Qué hace? En CADA cambio, compila y prueba el código. Es la primera red de
# seguridad del pipeline: si algo no compila o un test falla, se ve aquí antes
# de que el código se mezcle a main.
#
# Conceptos base de GitHub Actions que aparecen abajo:
#   - workflow : este archivo .yml completo (una "tubería" de automatización).
#   - trigger  : el evento que lo lanza (sección 'on').
#   - job      : una tarea que corre en su PROPIA máquina limpia.
#   - runner   : esa máquina virtual efímera que GitHub crea y destruye.
#   - step     : cada paso dentro del job; corren en orden, de arriba a abajo.
#   - action   : bloque reutilizable del Marketplace que se invoca con 'uses:'
#                (vs 'run:', que ejecuta un comando de shell que escribimos).
# ============================================================================
name: build

# "on" define QUÉ eventos disparan el workflow.
on:
  push:
    branches: [main]        # cada push a main
  pull_request:
    branches: [main]        # y cada PR que apunta a main (valida ANTES de mezclar)

# Un workflow tiene uno o más "jobs". Cada job corre en su propia máquina limpia.
jobs:
  # -------------------------------------------------------------------------
  # JOB único — build: compila, prueba y publica el resultado.
  # -------------------------------------------------------------------------
  build:
    name: Compilación y pruebas
    runs-on: ubuntu-latest   # máquina virtual efímera provista por GitHub

    # Los "steps" corren en orden, de arriba a abajo, en la misma máquina.
    steps:
      # Descarga tu código al runner. La máquina llega vacía, así que casi todo
      # workflow empieza con este checkout para tener los archivos disponibles.
      - name: Checkout
        uses: actions/checkout@v4

      # Instala el SDK de .NET para poder usar el comando `dotnet`.
      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Descarga los paquetes NuGet declarados en el proyecto.
      - name: Restaurar
        run: dotnet restore Inventory.sln

      # Compila en modo Release. --no-restore evita repetir el paso anterior.
      - name: Compilar (Release)
        run: dotnet build Inventory.sln --configuration Release --no-restore

      # Ejecuta las pruebas unitarias (xUnit). Si una falla, el job falla y frena el merge.
      - name: Pruebas
        run: dotnet test Inventory.sln --configuration Release --no-build --verbosity normal

      # Genera la salida publicable de la app en ./publish (sin recompilar).
      - name: Publicar la app
        run: dotnet publish src/Inventory.App/Inventory.App.csproj --configuration Release --no-build --output ./publish

      # Guarda esa salida como "artefacto" descargable desde la ejecución del workflow.
      - name: Subir artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: inventory-app
          path: ./publish
