# ============================================================================
# WORKFLOW: codeql  (GHAS — SAST: Static Application Security Testing)
# ============================================================================
# ¿Qué hace? Analiza TU CÓDIGO FUENTE en busca de vulnerabilidades (p. ej. una
# inyección SQL) y publica los hallazgos en la pestaña Security → Code scanning.
#
# Cómo razona CodeQL (idea clave): sigue el "camino" del dato desde una FUENTE
# (source) — una entrada no confiable, como una variable de entorno — hasta un
# SUMIDERO (sink) peligroso — como concatenar texto dentro de una consulta SQL.
# Si existe ese camino sin sanear, levanta una alerta.
#
# Diferencia con dependency-review.yml: CodeQL mira el código que TU escribes;
# Dependency Review mira el código de TERCEROS (las dependencias NuGet).
# ============================================================================
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]         # también escanea cada PR antes de mezclar

jobs:
  # -------------------------------------------------------------------------
  # JOB único — analyze: inicializa CodeQL, compila y ejecuta el análisis.
  # -------------------------------------------------------------------------
  analyze:
    name: Análisis CodeQL (csharp)
    runs-on: ubuntu-latest
    # 'permissions' da al job SOLO los permisos que necesita (principio de mínimo
    # privilegio). Sin 'security-events: write' no podría publicar las alertas.
    permissions:
      actions: read
      contents: read
      security-events: write  # imprescindible: permite escribir los hallazgos en Security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Prepara el motor de CodeQL antes de compilar.
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          # build-mode manual: nosotros compilamos (paso siguiente) y CodeQL observa la build.
          build-mode: manual
          # security-extended: conjunto ampliado de consultas de seguridad.
          queries: security-extended
          # threat-models local: trata args de CLI / variables de entorno como entrada NO confiable,
          # ampliando qué se considera "fuente" de datos peligrosos en el análisis.
          config: |
            threat-models: local

      # CodeQL necesita una compilación real para construir su base de datos de código.
      - name: Compilar (Release)
        run: dotnet build Inventory.sln --configuration Release

      # Ejecuta las consultas y sube los resultados a Security → Code scanning.
      - name: Ejecutar el análisis de CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
