name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Análisis CodeQL (csharp)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
          # Trata los argumentos de CLI / variables de entorno como entrada no confiable
          config: |
            threat-models: local

      - name: Compilar (Release)
        run: dotnet build Inventory.sln --configuration Release

      - name: Ejecutar el análisis de CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
