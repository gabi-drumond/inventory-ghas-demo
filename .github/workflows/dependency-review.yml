# GHAS — SCA (Software Composition Analysis).
# Revisa las DEPENDENCIAS que agrega/cambia un PR y bloquea si introducen
# una vulnerabilidad conocida (CVE/GHSA). Complementa a CodeQL: CodeQL mira TU código,
# este mira el código de TERCEROS que traes vía NuGet.
name: dependency-review

# Solo tiene sentido en PRs: compara las dependencias del PR contra la base (main).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read            # solo necesita leer el repositorio

jobs:
  dependency-review:
    name: Revisión de dependencias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Revisión de dependencias
        uses: actions/dependency-review-action@v4
        with:
          # Falla el check si el PR introduce una vulnerabilidad de severidad "high" o mayor.
          fail-on-severity: high
